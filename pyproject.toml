[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avalanche-view"
version = "0.1.0"
description = "Scientific desktop viewer for WRF and NetCDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6,<7", "xarray>=2024.10", "numpy>=1.26,<2.5",
  "matplotlib>=3.9,<4", "netCDF4>=1.7,<2", "h5netcdf>=1.4,<2",
  "h5py>=3.11,<4", "pyproj>=3.6,<4",
  "PyQt6-WebEngine>=6.6,<7", "rasterio>=1.4,<2", "rioxarray>=0.18,<1",
  "geopandas>=1,<2", "scipy>=1.14,<2", "shapely>=2,<3",
]

[project.optional-dependencies]
geo = ["cartopy>=0.23,<1"]
terrain = ["pyvista>=0.44,<1", "pyvistaqt>=0.11,<1", "vtk>=9.3,<10"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[project.scripts]
avalanche-view = "avalanche_view.app:main"

[tool.setuptools.packages.find]
include = ["avalanche_view*"]

[tool.setuptools.package-data]
avalanche_view = ["resources/*.svg", "resources/web/*", "resources/web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".runtime", "verification", "build", "dist", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
